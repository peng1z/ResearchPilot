name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on a branch are cancelled; main is never cancelled so every
# commit there keeps a complete status history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.11", so every supported
        # version is exercised rather than assumed.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      # requirements.txt is what the Docker image installs. Resolving it here
      # (without downloading torch) keeps that path from silently breaking,
      # since nothing else in CI exercises it.
      - name: Resolve the Docker install path
        run: python -m pip install --dry-run -r requirements.txt

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # `next lint` is not wired up: the project has no ESLint config or
      # dependency, so it cannot run unattended.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
