[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot-backend"
version = "0.1.0"
description = "FastAPI backend for the ResearchPilot multi-agent research copilot."
requires-python = ">=3.11"
dependencies = [
  # Pinned below 3: dspy 3.x installs a lazy proxy into sys.modules["numpy"],
  # and any later import of numpy through another package (qdrant-client
  # here) then fails with TypeError: data type 'bool' not understood.
  # Declared as dspy rather than the dspy-ai shim, which is what the code
  # imports and what the constraint has to bind to.
  "dspy>=2.6.0,<3",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "qdrant-client>=1.13.0,<1.15.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
]
# Only needed for EMBEDDING_BACKEND=local. sentence-transformers pulls in torch,
# so it stays out of the default install; app/embeddings.py imports it lazily
# and only on that code path.
local-embeddings = [
  "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

